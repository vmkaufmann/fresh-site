<section class="page pricing-page">
  <h1>Pricing</h1>
  <p class="pricing-intro">Fresh-pressed citrus juices, priced per liter.</p>

  <table class="pricing-table">
    <thead>
      <tr>
        <th scope="col">Variety</th>
        <th scope="col">Price (per liter)</th>
        <th scope="col" class="cart-col">
          <span class="visually-hidden">Add to cart</span>
        </th>
      </tr>
    </thead>
    <tbody>
      @for (variety of varieties; track variety.name) {
        <tr>
          <th scope="row">{{ variety.name }}</th>
          <td>{{ variety.price | currency }}</td>
          <td class="cart-col">
            <button
              type="button"
              class="add-to-cart-btn"
              (click)="addToCart(variety)"
              [attr.aria-label]="'Add ' + variety.name + ' juice to cart'"
            >
              Add to cart
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>
