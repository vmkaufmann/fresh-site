<header class="top-nav">
  <a class="brand" routerLink="/">Fresh Juice</a>
  <nav aria-label="Main navigation">
    <ul class="nav-list">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      </li>
      <li>
        <a routerLink="/learn-more" routerLinkActive="active">Learn More</a>
      </li>
      <li>
        <a routerLink="/pricing" routerLinkActive="active">Pricing</a>
      </li>
      <li>
        <a routerLink="/calendar" routerLinkActive="active">Calendar</a>
      </li>
    </ul>
  </nav>
  <a
    class="cart-link"
    routerLink="/cart"
    routerLinkActive="active"
    aria-label="Shopping cart"
  >
    <span class="cart-icon" aria-hidden="true">&#x1F6D2;</span>
    <span class="cart-label">Cart</span>
    @if (cartCount() > 0) {
      <span class="cart-badge" aria-label="items in cart">{{ cartCount() }}</span>
    }
  </a>
</header>

<router-outlet />
